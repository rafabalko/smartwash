<div class="veiculos-container">
  <h2>Meus Veículos</h2>

  <div *ngIf="mensagemSucesso" class="alert alert-success">{{ mensagemSucesso }}</div>
  <div *ngIf="mensagemErro" class="alert alert-danger">{{ mensagemErro }}</div>

  <!-- FORMULÁRIO DE CADASTRO / EDIÇÃO -->
  <div class="card-cadastro">
    <!-- O título muda dinamicamente -->
    <h3>{{ veiculoEditandoId ? 'Editar Veículo' : 'Adicionar Novo Veículo' }}</h3>

    <form (ngSubmit)="salvarVeiculo()">
      <div class="form-row">
        <div class="form-group">
          <label>Marca:</label>
          <input type="text" [(ngModel)]="marcaInput" name="marca" placeholder="Ex: Honda" class="form-control">
        </div>
        <div class="form-group">
          <label>Modelo:</label>
          <input type="text" [(ngModel)]="modeloInput" name="modelo" placeholder="Ex: Civic" class="form-control">
        </div>
        <div class="form-group">
          <label>Placa:</label>
          <input type="text" [(ngModel)]="placaInput" name="placa" placeholder="Ex: ABC1D23" class="form-control">
        </div>
      </div>

      <!-- Botões de Ação -->
      <div class="form-actions" style="display: flex; gap: 10px; margin-top: 15px;">
        <button type="submit" class="btn-cadastrar">
          {{ veiculoEditandoId ? '💾 Salvar Alterações' : '+ Cadastrar Veículo' }}
        </button>

        <!-- Botão de cancelar só aparece se estiver editando -->
        <button type="button" class="btn-cancelar" *ngIf="veiculoEditandoId" (click)="cancelarEdicao()">
          ✕ Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- LISTA DE VEÍCULOS -->
  <div class="lista-veiculos">
    <h3>Veículos Cadastrados</h3>

    <div *ngIf="carregando" class="text-muted">Carregando seus veículos...</div>

    <div *ngIf="!carregando && veiculos.length === 0" class="text-muted">
      Você ainda não possui veículos cadastrados.
    </div>

    <div class="grid-veiculos" *ngIf="!carregando && veiculos.length > 0">
      <div class="card-veiculo" *ngFor="let v of veiculos">
        <div class="veiculo-info">
          <h4>{{ v.modelo }}</h4>
          <p class="marca">Marca: {{ v.marca }}</p>
          <p class="placa">Placa: <strong>{{ v.placa }}</strong></p>
        </div>

        <!-- Nova div agrupando as ações -->
        <div class="acoes-veiculo" style="display: flex; gap: 8px; margin-top: 10px;">
          <button class="btn-editar" (click)="prepararEdicao(v)" title="Editar Veículo">✏️ Editar</button>
          <button class="btn-deletar" (click)="deletarVeiculo(v.id)" title="Remover Veículo">🗑️ Excluir</button>
        </div>
      </div>
    </div>
  </div>
</div>
