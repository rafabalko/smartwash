<div class="agendamento-container">

  <div class="card-agendamento">

    <div class="estabelecimento-header" *ngIf="estabelecimento">
      <h2>{{ estabelecimento.nome_fantasia || 'Lava-Rápido' }}</h2>
      <p class="endereco">{{ estabelecimento.endereco }}</p>
    </div>

    <h3>Novo Agendamento</h3>
    <p class="subtitle">Escolha o serviço, veículo e o horário livre na agenda.</p>

    <div *ngIf="mensagemSucesso" class="alert alert-success">{{ mensagemSucesso }}</div>
    <div *ngIf="mensagemErro" class="alert alert-danger">{{ mensagemErro }}</div>

    <form (ngSubmit)="realizarAgendamento()">

      <div class="form-group">
        <label>1. Escolha o Serviço:</label>
        <select [(ngModel)]="servicoSelecionadoId" name="servico" class="form-control" required>
          <option [ngValue]="null">-- Selecione um Serviço --</option>
          <option *ngFor="let s of servicos" [value]="s.id">
            {{ s.nome }} — R$ {{ s.preco }} ({{ s.duracao_em_minutos }} min)
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Escolha o seu Veículo:</label>
        <select [(ngModel)]="veiculoSelecionadoId" name="veiculo" class="form-control" required>
          <option [ngValue]="null">-- Selecione um Veículo --</option>
          <option *ngFor="let v of veiculos" [value]="v.id">
            {{ v.modelo }} — {{ v.placa }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>3. Seu Telefone / WhatsApp para Contato:</label>
        <input
          type="text"
          [(ngModel)]="telefoneCliente"
          name="telefoneCliente"
          class="form-control"
          placeholder="(00) 00000-0000"
          required
        />
        <small class="aviso-telefone">O lava-rápido usará este número para avisar sobre o veículo.</small>
      </div>

      <div class="form-group">
        <label>4. Escolha a Data:</label>
        <input
          type="date"
          [(ngModel)]="dataSelecionada"
          (change)="onDataChange()"
          name="dataAgendamento"
          class="form-control"
          required
        />
      </div>

      <div class="form-group" *ngIf="dataSelecionada">
        <label>5. Selecione o Horário Desejado:</label>
        <div class="grid-horarios">
          <button
            type="button"
            *ngFor="let h of horariosPossiveis"
            class="btn-horario"
            [class.ocupado]="isHorarioOcupado(h)"
            [class.selecionado]="horaSelecionada === h"
            [disabled]="isHorarioOcupado(h)"
            (click)="selecionarHora(h)">
            {{ h }}
            <span *ngIf="isHorarioOcupado(h)" class="label-ocupado">(Ocupado)</span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-agendar" [disabled]="carregando || !horaSelecionada">
        {{ carregando ? 'Agendando...' : 'Confirmar Agendamento' }}
      </button>

    </form>
  </div>
</div>
