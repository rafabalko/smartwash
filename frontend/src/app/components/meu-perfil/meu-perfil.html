<div class="perfil-container">
  <h2>Meu Perfil</h2>
  <p class="subtitle">Gerencie suas informações pessoais e de acesso ao sistema.</p>

  <div *ngIf="mensagemSucesso" class="alert alert-success">{{ mensagemSucesso }}</div>
  <div *ngIf="mensagemErro" class="alert alert-danger">{{ mensagemErro }}</div>

  <div *ngIf="carregando" class="carregando">Carregando dados do perfil...</div>

  <div class="card-perfil" *ngIf="!carregando">
    <form (ngSubmit)="salvarPerfil()">

      <div class="form-row">
        <div class="form-group">
          <label>Nome de Usuário (Login):</label>
          <input type="text" [value]="perfil.user.username" class="form-control" disabled />
        </div>

        <div class="form-group">
          <label>Tipo de Perfil:</label>
          <input type="text" [value]="perfil.tipo === 'ADMIN' ? 'Administrador' : 'Cliente'" class="form-control" disabled />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Nome:</label>
          <input type="text" [(ngModel)]="perfil.user.first_name" name="first_name" class="form-control" placeholder="Seu nome" />
        </div>

        <div class="form-group">
          <label>Sobrenome:</label>
          <input type="text" [(ngModel)]="perfil.user.last_name" name="last_name" class="form-control" placeholder="Seu sobrenome" />
        </div>
      </div>

      <div class="form-group">
        <label>E-mail:</label>
        <input type="email" [(ngModel)]="perfil.user.email" name="email" class="form-control" placeholder="seuemail@exemplo.com" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Telefone / WhatsApp:</label>
          <input type="text" [(ngModel)]="perfil.telefone" (input)="aplicarMascaraTelefone($event)" name="telefone" class="form-control" placeholder="(00) 00000-0000" />
        </div>

        <div class="form-group">
          <label>Data de Nascimento:</label>
          <input type="date" [(ngModel)]="perfil.data_nascimento" name="data_nascimento" class="form-control" />
        </div>
      </div>

      <div class="form-group">
        <label>Gênero:</label>
        <select [(ngModel)]="perfil.genero" name="genero" class="form-control">
          <option value="">Selecione...</option>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
          <option value="O">Outro / Prefiro não informar</option>
        </select>
      </div>

      <button type="submit" class="btn-salvar-perfil" [disabled]="salvando">
        {{ salvando ? 'Salvando...' : 'Salvar Alterações' }}
      </button>

    </form>
  </div>
</div>
