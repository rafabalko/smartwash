<app-navbar
  [isLoggedIn]="isLoggedIn"
  [userTipo]="userTipo"
  [abaAtiva]="abaAtiva"
  (mudarAba)="mudarAba($event)"
  (logout)="executarLogout()">
</app-navbar>

<main class="main-content">

  <app-auth *ngIf="!isLoggedIn || abaAtiva === 'login'"></app-auth>

  <ng-container *ngIf="isLoggedIn && userTipo !== 'ADMIN'">
    <app-busca-estabelecimentos
      *ngIf="abaAtiva === 'buscar'"
      (selecionarEstabelecimento)="onEstabelecimentoSelecionado($event)">
    </app-busca-estabelecimentos>

    <app-detalhes-estabelecimento
      *ngIf="abaAtiva === 'detalhes-estabelecimento'"
      [estabelecimento]="estabelecimentoSelecionado!"
      (irParaAgendamento)="irParaFormularioAgendamento()"
      (voltarBusca)="voltarParaBusca()">
    </app-detalhes-estabelecimento>

    <app-favoritos
      *ngIf="abaAtiva === 'favoritos'"
      (selecionarEstabelecimento)="onEstabelecimentoSelecionado($event)">
    </app-favoritos>

    <app-agendamento
      *ngIf="abaAtiva === 'novo-agendamento'"
      [estabelecimento]="estabelecimentoSelecionado"
      (mudarAba)="mudarAba($event)">
    </app-agendamento>

    <app-historico-agendamentos
      *ngIf="abaAtiva === 'agendamentos'">
    </app-historico-agendamentos>

    <app-meus-veiculos *ngIf="abaAtiva === 'veiculos'"></app-meus-veiculos>
  </ng-container>

  <ng-container *ngIf="isLoggedIn && userTipo === 'ADMIN'">
    <app-dashboard-admin *ngIf="abaAtiva === 'dashboard'"></app-dashboard-admin>

    <app-clientes-admin *ngIf="abaAtiva === 'clientes'"></app-clientes-admin>

    <app-agendamento
      *ngIf="abaAtiva === 'agendamento'"
      [estabelecimento]="estabelecimentoSelecionado">
    </app-agendamento>

    <app-historico-agendamentos
      *ngIf="abaAtiva === 'historico'">
    </app-historico-agendamentos>

    <app-gestao-servicos *ngIf="abaAtiva === 'servicos'"></app-gestao-servicos>

    <app-minha-empresa *ngIf="abaAtiva === 'empresa'"></app-minha-empresa>
  </ng-container>

  <app-meu-perfil *ngIf="isLoggedIn && abaAtiva === 'perfil'"></app-meu-perfil>

</main>
